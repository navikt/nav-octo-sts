name: Build and deploy main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    permissions:
      actions: read # for sarif
      contents: write # for dependency graph & sarif
      security-events: write # push sarif to github security
      id-token: write # for nais docker-build-push
      packages: read # for pulling the baseimage
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Determine base image SHA
        id: baseimg
        run: |
          echo Getting baseimage name and tag
          img=$(grep octo Dockerfile | awk '{ print $NF }')
          echo "img=$img" >> ${GITHUB_OUTPUT}
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify baseimage
        run: |
          cosign verify ${IMG} --certificate-identity-regexp "^https://github\.com/octo-sts/app/\.github/workflows/container\.yaml.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        env:
          IMG: ${{ steps.baseimg.outputs.img }}
      - name: Build & push docker image + SBOM
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: gitmasters
          pull: true
          push_image: true

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read # needs to read app descriptor
      id-token: write # for nais deploy
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1
        with:
          team: gitmasters
      - name: Deploy to prod-gcp
        run: | # zizmor: ignore[template-injection]
          nais apply .nais/nais.yaml \
            --environment prod-gcp \
            --set spec.image="${{ needs.build.outputs.image }}" \ 
            --wait
