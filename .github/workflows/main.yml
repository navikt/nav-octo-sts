name: Build and deploy main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    permissions:
      actions: read # for sarif
      contents: write # for dependency graph & sarif
      security-events: write # push sarif to github security
      id-token: write # for nais docker-build-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Determine base image SHA
        id: baseimg
        run: |
          echo Getting baseimage name and tag
          img=$(grep octo Dockerfile | awk '{ print $NF }')
          echo "img=$img" >> ${GITHUB_OUTPUT}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.1
      - name: Verify baseimage
        run: |
          cosign verify ${IMG} --certificate-identity-regexp "^https://github\.com/octo-sts/app/\.github/workflows/container\.yaml.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
        env:
          IMG: ${{ steps.baseimg.outputs.img }}
      - uses: nais/setup@v1
        with:
          team: gitmasters
      - name: Build & push docker image + SBOM
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: gitmasters
          pull: true
          push_image: false

